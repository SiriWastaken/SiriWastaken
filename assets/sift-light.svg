<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-labelledby="t d">
<title id="t">SIFT commands</title><desc id="d">SIFT reads a local project with four commands: inspect, check, doctor and diff. It reports what it can back with evidence and says unknown for everything else.</desc>
<defs><style>
.s{font-family:-apple-system,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.cap{font-size:12px;fill:#6e6e73}
.t{font-size:13px;font-weight:600;fill:#1d1d1f}
.u{font-size:11px;fill:#6e6e73}
.a{font-size:11px;fill:#0066cc}
.box{fill:#fbfbfd;stroke:#d2d2d7;stroke-width:1}
.hi{fill:#fbfbfd;stroke:#0066cc;stroke-width:1.5}
.ok{fill:#fbfbfd;stroke:#1f8a3d;stroke-width:1.5}
.warn{fill:none;stroke:#c45500;stroke-width:1.5;stroke-dasharray:4 3}
.unk{fill:none;stroke:#6e6e73;stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:#6e6e73;stroke-width:1.5}
.fl{fill:none;stroke:#0066cc;stroke-width:1.5}
</style><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0066cc"/></marker><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6e6e73"/></marker></defs>
<rect width="440" height="210" rx="18" fill="#f5f5f7"/>
<text class="cap s" x="20" y="32">Four commands, no guessing</text><rect class="box" x="20" y="78" width="92" height="56" rx="10"/><text class="t s" x="66.0" y="104.0" text-anchor="middle">project</text><text class="u s" x="66.0" y="119.0" text-anchor="middle">your repo</text><path class="ln" d="M112 106H138V66H158"/><rect class="box" x="160" y="52" width="100" height="28" rx="10"/><text class="t m" x="210.0" y="70.5" text-anchor="middle">inspect</text><path class="ln" d="M260 66H288"/><path class="ln" d="M112 106H138V102H158"/><rect class="box" x="160" y="88" width="100" height="28" rx="10"/><text class="t m" x="210.0" y="106.5" text-anchor="middle">check</text><path class="ln" d="M260 102H288"/><path class="ln" d="M112 106H138V138H158"/><rect class="box" x="160" y="124" width="100" height="28" rx="10"/><text class="t m" x="210.0" y="142.5" text-anchor="middle">doctor</text><path class="ln" d="M260 138H288"/><path class="ln" d="M112 106H138V174H158"/><rect class="box" x="160" y="160" width="100" height="28" rx="10"/><text class="t m" x="210.0" y="178.5" text-anchor="middle">diff</text><path class="ln" d="M260 174H288"/><path class="ln" d="M288 66V174"/><path class="ln" d="M288 94H312" marker-end="url(#m)"/><path class="ln" d="M288 140H312" marker-end="url(#m)"/><rect class="ok" x="314" y="78" width="106" height="32" rx="10"/><text class="t m" x="367.0" y="98.5" text-anchor="middle">evidence</text><rect class="unk" x="314" y="124" width="106" height="32" rx="10"/><text class="t m" x="367.0" y="144.5" text-anchor="middle">unknown</text>
