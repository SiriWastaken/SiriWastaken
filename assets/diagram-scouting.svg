<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-labelledby="t d">
<title id="t">FRC 610 scouting data flow</title><desc id="d">Scout tablets store match data locally in Couchbase Lite, then sync through a Toaster network box and Sync Gateway to Couchbase, which feeds a Next.js analysis dashboard.</desc>
<defs><style>
