<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t d">
<title id="t">Sri Ganty</title><desc id="d">Three layers of my work: robotics projects (scouting, match sim, Wii board), the systems under them (sync, a 60 Hz tick, HID) and developer tools (SIFT, Claudeium, plugins).</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b1a30"/></linearGradient><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.cap{font-size:11px;letter-spacing:.14em;fill:#4c9a76}
.t{font-size:13px;font-weight:600;fill:#e6edf3}
.u{font-size:11px;fill:#8b949e}
.lab{font-size:11px;fill:#58a6ff}
.box{fill:#161b22;stroke:#388bfd;stroke-width:1.5}
.gbox{fill:#161b22;stroke:#4c9a76;stroke-width:1.5}
.dbox{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:4 3}
.abox{fill:none;stroke:#d29922;stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:#8b949e;stroke-width:1.5}
.flow{fill:none;stroke:#4c9a76;stroke-width:1.5;stroke-dasharray:4 6;animation:f 1.6s linear infinite}
@keyframes f{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#388bfd" stroke-opacity=".10"/></pattern></defs>
<rect width="1000" height="240" fill="url(#bg)"/>
<rect width="1000" height="240" fill="url(#g)"/><rect y="238" width="1000" height="2" fill="#4c9a76"/><text class="cap m" x="48" y="70" font-size="12">FRC TEAM 610 · CRESCENT COYOTES</text><text class="s" x="48" y="124" font-size="48" font-weight="700" fill="#e6edf3">Sri Ganty</text><text class="s" x="48" y="156" font-size="17" fill="#8b949e">Scouting software for a robotics team,</text><text class="s" x="48" y="180" font-size="17" fill="#8b949e">from the tablet app to the dashboard.</text><text class="m" x="48" y="212" font-size="12" fill="#58a6ff">Java · TypeScript · Kotlin · Next.js · Couchbase</text><text class="u m" x="560" y="75" font-size="10" letter-spacing="1.5">ROBOTICS</text><rect class="box" x="650" y="56" width="96" height="30" rx="6"/><text class="m" x="698" y="75" font-size="11" fill="#e6edf3" text-anchor="middle">scouting</text><rect class="box" x="754" y="56" width="96" height="30" rx="6"/><text class="m" x="802" y="75" font-size="11" fill="#e6edf3" text-anchor="middle">match sim</text><rect class="box" x="858" y="56" width="96" height="30" rx="6"/><text class="m" x="906" y="75" font-size="11" fill="#e6edf3" text-anchor="middle">wii board</text><path class="flow" d="M698 86V106"/><path class="flow" d="M802 86V106"/><path class="flow" d="M906 86V106"/><text class="u m" x="560" y="125" font-size="10" letter-spacing="1.5">SYSTEMS</text><rect class="box" x="650" y="106" width="96" height="30" rx="6"/><text class="m" x="698" y="125" font-size="11" fill="#e6edf3" text-anchor="middle">sync</text><rect class="box" x="754" y="106" width="96" height="30" rx="6"/><text class="m" x="802" y="125" font-size="11" fill="#e6edf3" text-anchor="middle">60 Hz tick</text><rect class="box" x="858" y="106" width="96" height="30" rx="6"/><text class="m" x="906" y="125" font-size="11" fill="#e6edf3" text-anchor="middle">HID</text><text class="u m" x="560" y="175" font-size="10" letter-spacing="1.5">TOOLS</text><rect class="box" x="650" y="156" width="96" height="30" rx="6"/><text class="m" x="698" y="175" font-size="11" fill="#e6edf3" text-anchor="middle">sift</text><rect class="box" x="754" y="156" width="96" height="30" rx="6"/><text class="m" x="802" y="175" font-size="11" fill="#e6edf3" text-anchor="middle">claudeium</text><rect class="box" x="858" y="156" width="96" height="30" rx="6"/><text class="m" x="906" y="175" font-size="11" fill="#e6edf3" text-anchor="middle">plugins</text>
