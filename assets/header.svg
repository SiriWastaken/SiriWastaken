<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t d">
  <title id="t">Sri Ganty</title>
  <desc id="d">Scouting data flowing from scout tablets through a sync hub into a database and a dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1a30"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f6feb" stroke-opacity=".10"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .node{fill:#0d1117;stroke:#388bfd;stroke-width:1.5}
      .lbl{fill:#8b949e;font-size:10px;letter-spacing:.08em;text-anchor:middle}
      .wire{fill:none;stroke:#4c9a76;stroke-width:1.5;stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-20}}
      @media (prefers-reduced-motion:reduce){.wire{animation:none}}
    </style>
  </defs>
  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>
  <rect x="0" y="238" width="1000" height="2" fill="#4c9a76"/>

  <text x="48" y="70" class="mono" font-size="12" letter-spacing="2.5" fill="#4c9a76">FRC TEAM 610 · CRESCENT COYOTES</text>
  <text x="48" y="124" class="sans" font-size="48" font-weight="700" fill="#e6edf3">Sri Ganty</text>
  <text x="48" y="156" class="sans" font-size="17" fill="#8b949e">Scouting software for a robotics team,</text>
  <text x="48" y="180" class="sans" font-size="17" fill="#8b949e">from the tablet app to the dashboard.</text>
  <text x="48" y="212" class="mono" font-size="12" fill="#58a6ff">Java · TypeScript · Kotlin · Next.js · Couchbase</text>

  <!-- scout tablets -->
  <g class="node">
    <rect x="560" y="64" width="52" height="34" rx="5"/>
    <rect x="560" y="112" width="52" height="34" rx="5"/>
    <rect x="560" y="160" width="52" height="34" rx="5"/>
  </g>
  <!-- wires -->
  <path class="wire" d="M612 81H636V129H660"/>
  <path class="wire" d="M612 129H660"/>
  <path class="wire" d="M612 177H636V129"/>
  <path class="wire" d="M724 129H770"/>
  <path class="wire" d="M826 129H870"/>
  <!-- sync hub -->
  <rect class="node" x="660" y="105" width="64" height="48" rx="6"/>
  <path d="M676 129h32M700 121l8 8-8 8" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <!-- database -->
  <g class="node">
    <path d="M770 112v34c0 6 12.5 10 28 10s28-4 28-10v-34"/>
    <ellipse cx="798" cy="112" rx="28" ry="10"/>
  </g>
  <path d="M770 129c0 6 12.5 10 28 10s28-4 28-10" fill="none" stroke="#388bfd" stroke-width="1.5"/>
  <!-- dashboard -->
  <rect class="node" x="870" y="97" width="72" height="64" rx="6"/>
  <g fill="#4c9a76">
    <rect x="882" y="130" width="10" height="18"/>
    <rect x="898" y="116" width="10" height="32"/>
    <rect x="914" y="124" width="10" height="24"/>
  </g>

  <g class="lbl mono">
    <text x="586" y="214">SCOUT</text>
    <text x="692" y="176">SYNC</text>
    <text x="798" y="176">STORE</text>
    <text x="906" y="180">ANALYZE</text>
  </g>
</svg>
