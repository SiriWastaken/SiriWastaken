<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-labelledby="t d">
<title id="t">Claudeium completion ledger</title><desc id="d">A task becomes verified only after a recorded passing check. Editing the file afterwards marks the evidence stale. A verified result can be handed off to another agent.</desc>
<defs><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.cap{font-size:11px;letter-spacing:.14em;fill:#4c9a76}
.t{font-size:13px;font-weight:600;fill:#e6edf3}
.u{font-size:11px;fill:#8b949e}
.lab{font-size:11px;fill:#58a6ff}
.box{fill:#161b22;stroke:#388bfd;stroke-width:1.5}
.gbox{fill:#161b22;stroke:#4c9a76;stroke-width:1.5}
.dbox{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:4 3}
.abox{fill:none;stroke:#d29922;stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:#8b949e;stroke-width:1.5}
.flow{fill:none;stroke:#4c9a76;stroke-width:1.5;stroke-dasharray:4 6;animation:f 1.6s linear infinite}
@keyframes f{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#388bfd" stroke-opacity=".09"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4c9a76"/></marker>
<marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8b949e"/></marker>
</defs>
<rect x=".5" y=".5" width="399" height="179" rx="8" fill="#0d1117" stroke="#30363d"/>
<rect x=".5" y=".5" width="399" height="179" rx="8" fill="url(#g)"/>
<text class="cap m" x="16" y="24">EVIDENCE-BASED COMPLETION</text><rect class="box" x="14" y="62" width="64" height="34" rx="6"/><text class="t m" x="46.0" y="83.5" text-anchor="middle">task</text><path class="flow" d="M78 79H98" marker-end="url(#a)"/><rect class="box" x="100" y="62" width="64" height="34" rx="6"/><text class="t m" x="132.0" y="83.5" text-anchor="middle">check</text><path class="flow" d="M164 79H184" marker-end="url(#a)"/><rect class="gbox" x="186" y="62" width="80" height="34" rx="6"/><text class="t m" x="226.0" y="83.5" text-anchor="middle">verified</text><path class="flow" d="M266 79H298" marker-end="url(#a)"/><rect class="box" x="300" y="62" width="84" height="34" rx="6"/><text class="t m" x="342.0" y="83.5" text-anchor="middle">handoff</text><path class="ln" d="M226 96V128" marker-end="url(#m)"/><text class="lab s" x="234" y="116">file edited</text><rect class="abox" x="186" y="130" width="80" height="30" rx="6"/><text class="t m" x="226.0" y="149.5" text-anchor="middle">STALE</text>
</svg>
