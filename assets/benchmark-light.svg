<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-labelledby="t d">
<title id="t">Scouting app benchmark</title><desc id="d">A React Native app and a native Java app run the same scripted workload through one harness. Each run's final state is checked against a reference model, wrong runs are dropped, and the rest feed latency, frame, CPU and memory statistics.</desc>
<defs><style>
.s{font-family:-apple-system,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.cap{font-size:12px;fill:#6e6e73}
.t{font-size:13px;font-weight:600;fill:#1d1d1f}
.u{font-size:11px;fill:#6e6e73}
.a{font-size:11px;fill:#0066cc}
.box{fill:#fbfbfd;stroke:#d2d2d7;stroke-width:1}
.hi{fill:#fbfbfd;stroke:#0066cc;stroke-width:1.5}
.ok{fill:#fbfbfd;stroke:#1f8a3d;stroke-width:1.5}
.warn{fill:none;stroke:#c45500;stroke-width:1.5;stroke-dasharray:4 3}
.unk{fill:none;stroke:#6e6e73;stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:#6e6e73;stroke-width:1.5}
.fl{fill:none;stroke:#0066cc;stroke-width:1.5}
</style><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0066cc"/></marker><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6e6e73"/></marker></defs>
<rect width="440" height="210" rx="18" fill="#f5f5f7"/>
<text class="cap s" x="20" y="32">Same workload, two apps, one fair comparison</text><rect class="box" x="20" y="58" width="120" height="40" rx="10"/><text class="t s" x="80.0" y="82.5" text-anchor="middle">React Native</text><rect class="box" x="20" y="114" width="120" height="40" rx="10"/><text class="t s" x="80.0" y="138.5" text-anchor="middle">Native Java</text><path class="ln" d="M140 78H156V106H176M140 134H156V106"/><rect class="box" x="178" y="74" width="100" height="64" rx="10"/><text class="t s" x="228.0" y="104.0" text-anchor="middle">Harness</text><text class="u s" x="228.0" y="119.0" text-anchor="middle">scripted taps</text><path class="fl" d="M278 106H312" marker-end="url(#a)"/><rect class="ok" x="314" y="58" width="108" height="48" rx="10"/><text class="t s" x="368.0" y="80.0" text-anchor="middle">Checksum</text><text class="u s" x="368.0" y="95.0" text-anchor="middle">bad runs dropped</text><path class="fl" d="M368 106V124" marker-end="url(#a)"/><rect class="box" x="314" y="126" width="108" height="48" rx="10"/><text class="t s" x="368.0" y="148.0" text-anchor="middle">Statistics</text><text class="u s" x="368.0" y="163.0" text-anchor="middle">latency, CPU, memory</text>
</svg>
