<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-labelledby="t d">
<title id="t">Scouting app 2026 data flow</title><desc id="d">Scout tablets write to a local Couchbase Lite database, which syncs through the Toaster network box and Sync Gateway to every tablet. The analysis tabs read that data, and The Blue Alliance supplies teams and schedules.</desc>
<defs><style>
.s{font-family:-apple-system,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.cap{font-size:12px;fill:#6e6e73}
.t{font-size:13px;font-weight:600;fill:#1d1d1f}
.u{font-size:11px;fill:#6e6e73}
.a{font-size:11px;fill:#0066cc}
.box{fill:#fbfbfd;stroke:#d2d2d7;stroke-width:1}
.hi{fill:#fbfbfd;stroke:#0066cc;stroke-width:1.5}
.ok{fill:#fbfbfd;stroke:#1f8a3d;stroke-width:1.5}
.warn{fill:none;stroke:#c45500;stroke-width:1.5;stroke-dasharray:4 3}
.unk{fill:none;stroke:#6e6e73;stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:#6e6e73;stroke-width:1.5}
.fl{fill:none;stroke:#0066cc;stroke-width:1.5}
</style><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0066cc"/></marker><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6e6e73"/></marker></defs>
<rect width="440" height="210" rx="18" fill="#f5f5f7"/>
<text class="cap s" x="20" y="32">How a match gets from a scout's tablet to the strategy team</text><rect class="box" x="20" y="56" width="110" height="44" rx="10"/><text class="t s" x="75.0" y="82.5" text-anchor="middle">Scout tablets</text><path class="fl" d="M130 78H158" marker-end="url(#a)"/><rect class="box" x="160" y="56" width="120" height="44" rx="10"/><text class="t s" x="220.0" y="76.0" text-anchor="middle">Couchbase Lite</text><text class="u s" x="220.0" y="91.0" text-anchor="middle">local, offline</text><path class="fl" d="M280 78H308" marker-end="url(#a)"/><rect class="box" x="310" y="56" width="110" height="44" rx="10"/><text class="t s" x="365.0" y="76.0" text-anchor="middle">The Toaster</text><text class="u s" x="365.0" y="91.0" text-anchor="middle">switch + LTE</text><path class="fl" d="M365 100V138" marker-end="url(#a)"/><rect class="box" x="310" y="140" width="110" height="44" rx="10"/><text class="t s" x="365.0" y="160.0" text-anchor="middle">Sync Gateway</text><text class="u s" x="365.0" y="175.0" text-anchor="middle">push and pull</text><path class="fl" d="M310 162H282" marker-end="url(#a)"/><rect class="ok" x="160" y="140" width="120" height="44" rx="10"/><text class="t s" x="220.0" y="160.0" text-anchor="middle">Analysis tabs</text><text class="u s" x="220.0" y="175.0" text-anchor="middle">stats, picklist</text><rect class="box" x="20" y="140" width="110" height="44" rx="10"/><text class="t s" x="75.0" y="160.0" text-anchor="middle">Blue Alliance</text><text class="u s" x="75.0" y="175.0" text-anchor="middle">teams, schedules</text><path class="ln" d="M130 162H158" marker-end="url(#m)"/>
</svg>
