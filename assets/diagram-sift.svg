<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-labelledby="t d">
<title id="t">SIFT commands</title><desc id="d">SIFT reads a local project with four commands: inspect, check, doctor and diff. It reports what it can back with evidence and marks everything else unknown.</desc>
<defs><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.cap{font-size:11px;letter-spacing:.14em;fill:#4c9a76}
.t{font-size:13px;font-weight:600;fill:#e6edf3}
.u{font-size:11px;fill:#8b949e}
.lab{font-size:11px;fill:#58a6ff}
.box{fill:#161b22;stroke:#388bfd;stroke-width:1.5}
.gbox{fill:#161b22;stroke:#4c9a76;stroke-width:1.5}
.dbox{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:4 3}
.abox{fill:none;stroke:#d29922;stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:#8b949e;stroke-width:1.5}
.flow{fill:none;stroke:#4c9a76;stroke-width:1.5;stroke-dasharray:4 6;animation:f 1.6s linear infinite}
@keyframes f{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#388bfd" stroke-opacity=".09"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4c9a76"/></marker>
<marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8b949e"/></marker>
</defs>
<rect x=".5" y=".5" width="399" height="179" rx="8" fill="#0d1117" stroke="#30363d"/>
<rect x=".5" y=".5" width="399" height="179" rx="8" fill="url(#g)"/>
<text class="cap m" x="16" y="24">LOCAL ONLY · NO NETWORK</text><rect class="box" x="16" y="62" width="84" height="56" rx="6"/><text class="t s" x="58.0" y="87.0" text-anchor="middle">project</text><text class="u s" x="58.0" y="102.0" text-anchor="middle">your repo</text><path class="ln" d="M100 90H140V54H160"/><rect class="box" x="160" y="42" width="104" height="26" rx="6"/><text class="t m" x="212.0" y="59.5" text-anchor="middle">inspect</text><path class="ln" d="M264 55H282"/><path class="ln" d="M100 90H140V86H160"/><rect class="box" x="160" y="74" width="104" height="26" rx="6"/><text class="t m" x="212.0" y="91.5" text-anchor="middle">check</text><path class="ln" d="M264 87H282"/><path class="ln" d="M100 90H140V118H160"/><rect class="box" x="160" y="106" width="104" height="26" rx="6"/><text class="t m" x="212.0" y="123.5" text-anchor="middle">doctor</text><path class="ln" d="M264 119H282"/><path class="ln" d="M100 90H140V150H160"/><rect class="box" x="160" y="138" width="104" height="26" rx="6"/><text class="t m" x="212.0" y="155.5" text-anchor="middle">diff</text><path class="ln" d="M264 151H282"/><path class="ln" d="M282 55V151"/><path class="ln" d="M282 82H300" marker-end="url(#m)"/><path class="ln" d="M282 122H300" marker-end="url(#m)"/><rect class="gbox" x="302" y="66" width="82" height="32" rx="6"/><text class="t m" x="343.0" y="86.5" text-anchor="middle">evidence</text><rect class="dbox" x="302" y="106" width="82" height="32" rx="6"/><text class="t m" x="343.0" y="126.5" text-anchor="middle">unknown</text>
