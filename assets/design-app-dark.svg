<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-labelledby="t d">
<title id="t">Design App request pipeline</title><desc id="d">Each server action passes through authenticate, rate limit, validate, authorize, the handler, and an audit step, in that order.</desc>
<defs><style>
.s{font-family:-apple-system,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.cap{font-size:12px;fill:#a1a1a6}
.t{font-size:13px;font-weight:600;fill:#f5f5f7}
.u{font-size:11px;fill:#a1a1a6}
.a{font-size:11px;fill:#2997ff}
.box{fill:#000000;stroke:#424245;stroke-width:1}
.hi{fill:#000000;stroke:#2997ff;stroke-width:1.5}
.ok{fill:#000000;stroke:#30d158;stroke-width:1.5}
.warn{fill:none;stroke:#ff9f0a;stroke-width:1.5;stroke-dasharray:4 3}
.unk{fill:none;stroke:#a1a1a6;stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:#a1a1a6;stroke-width:1.5}
.fl{fill:none;stroke:#2997ff;stroke-width:1.5}
</style><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2997ff"/></marker><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a1a1a6"/></marker></defs>
<rect width="440" height="210" rx="18" fill="#1c1c1e"/>
<text class="cap s" x="20" y="32">Every server action goes through one pipeline</text><rect class="box" x="20" y="56" width="120" height="40" rx="10"/><text class="t s" x="80.0" y="80.5" text-anchor="middle">authenticate</text><text class="u s" x="28" y="51">1</text><rect class="box" x="160" y="56" width="120" height="40" rx="10"/><text class="t s" x="220.0" y="80.5" text-anchor="middle">rate limit</text><text class="u s" x="168" y="51">2</text><rect class="box" x="300" y="56" width="120" height="40" rx="10"/><text class="t s" x="360.0" y="80.5" text-anchor="middle">validate</text><text class="u s" x="308" y="51">3</text><rect class="box" x="20" y="134" width="120" height="40" rx="10"/><text class="t s" x="80.0" y="158.5" text-anchor="middle">authorize</text><text class="u s" x="28" y="129">4</text><rect class="ok" x="160" y="134" width="120" height="40" rx="10"/><text class="t s" x="220.0" y="158.5" text-anchor="middle">handler</text><text class="u s" x="168" y="129">5</text><rect class="box" x="300" y="134" width="120" height="40" rx="10"/><text class="t s" x="360.0" y="158.5" text-anchor="middle">audit</text><text class="u s" x="308" y="129">6</text><path class="fl" d="M140 76H158" marker-end="url(#a)"/><path class="fl" d="M280 76H298" marker-end="url(#a)"/><path class="fl" d="M360 96V115H80V132" marker-end="url(#a)"/><path class="fl" d="M140 154H158" marker-end="url(#a)"/><path class="fl" d="M280 154H298" marker-end="url(#a)"/>
</svg>
