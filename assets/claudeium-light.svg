<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-labelledby="t d">
<title id="t">Claudeium task ledger</title><desc id="d">A task is verified only after a recorded passing check. Editing the covered files afterwards marks the evidence stale. A verified result can be handed off to another agent.</desc>
<defs><style>
.s{font-family:-apple-system,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.cap{font-size:12px;fill:#6e6e73}
.t{font-size:13px;font-weight:600;fill:#1d1d1f}
.u{font-size:11px;fill:#6e6e73}
.a{font-size:11px;fill:#0066cc}
.box{fill:#fbfbfd;stroke:#d2d2d7;stroke-width:1}
.hi{fill:#fbfbfd;stroke:#0066cc;stroke-width:1.5}
.ok{fill:#fbfbfd;stroke:#1f8a3d;stroke-width:1.5}
.warn{fill:none;stroke:#c45500;stroke-width:1.5;stroke-dasharray:4 3}
.unk{fill:none;stroke:#6e6e73;stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:#6e6e73;stroke-width:1.5}
.fl{fill:none;stroke:#0066cc;stroke-width:1.5}
</style><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0066cc"/></marker><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6e6e73"/></marker></defs>
<rect width="440" height="210" rx="18" fill="#f5f5f7"/>
<text class="cap s" x="20" y="32">Nothing counts as done until a check has passed</text><rect class="box" x="20" y="70" width="66" height="36" rx="10"/><text class="t m" x="53.0" y="92.5" text-anchor="middle">task</text><path class="fl" d="M86 88H108" marker-end="url(#a)"/><rect class="box" x="110" y="70" width="66" height="36" rx="10"/><text class="t m" x="143.0" y="92.5" text-anchor="middle">check</text><path class="fl" d="M176 88H198" marker-end="url(#a)"/><rect class="ok" x="200" y="70" width="90" height="36" rx="10"/><text class="t m" x="245.0" y="92.5" text-anchor="middle">verified</text><path class="fl" d="M290 88H320" marker-end="url(#a)"/><rect class="box" x="322" y="70" width="98" height="36" rx="10"/><text class="t m" x="371.0" y="92.5" text-anchor="middle">handoff</text><path class="ln" d="M245 106V144" marker-end="url(#m)"/><text class="a s" x="255" y="130">file edited</text><rect class="warn" x="200" y="146" width="90" height="32" rx="10"/><text class="t m" x="245.0" y="166.5" text-anchor="middle">STALE</text>
</svg>
